# Compilation d'un IPA iOS, sans certificat ni profil dans ce dépôt.
#
# À lire avant de lancer quoi que ce soit, car c'est ici que les attentes
# doivent être justes :
#
#  - Un IPA **non signé ne s'installe pas** sur un iPhone en usage normal.
#    iOS refuse d'exécuter une application dont la signature ne correspond pas
#    à un profil autorisé par Apple. Le fichier produit ici sert donc à
#    archiver la compilation, à l'installer sur un simulateur, ou à la signer
#    ensuite — pas à être posé sur un téléphone tel quel.
#
#  - Pour installer sur un vrai iPhone, deux chemins existent, tous deux
#    demandant votre compte Apple :
#      1. faire signer la compilation par Expo, qui gère le certificat et le
#         profil à votre place (nécessite un compte Apple Developer pour une
#         durée de vie au-delà de sept jours) ;
#      2. compiler hors ligne sur un Mac avec Xcode, où vous êtes déjà
#         propriétaire de vos certificats.
#
#  - Aucun certificat, aucun mot de passe et aucun profil de signature ne doit
#    être déposé dans ce dépôt public. Si vous choisissez la signature par
#    Expo, les éléments sensibles restent dans les secrets GitHub et chez Expo.

name: IPA iOS

on:
  workflow_dispatch:
    inputs:
      signer_avec_expo:
        description: 'Confier la signature à Expo (nécessite un compte Apple déclaré chez Expo)'
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

# Droits d'écriture, et un seul : `contents: write`, pour attacher l'IPA à la
# publication d'une version étiquetée. Les identifiants Apple, s'ils servent,
# sont enregistrés chez Expo et dans les secrets GitHub — jamais utilisés pour
# écrire dans ce dépôt.
permissions:
  contents: write

jobs:
  construire-ipa:
    name: Construire l'IPA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier les flux de travail
        # Quelques secondes, contre une heure de compilation iOS.
        run: node scripts/check-workflows.mjs

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Lancer les tests
        run: npm run test:domaine

      - name: Installer EAS
        run: npm install --global eas-cli

      - name: Vérifier le jeton Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Le secret EXPO_TOKEN n'est pas défini sur ce dépôt."
            echo "Sans lui, aucune compilation iOS n'est possible."
            exit 1
          fi
          eas whoami

      # Chemin 1 : Expo signe et produit un IPA installable.
      - name: Compilation iOS signée par Expo
        if: inputs.signer_avec_expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile apercu --non-interactive --wait

      # Chemin 2 : compilation sans signature, pour archive ou simulateur.
      # Une compilation iOS exige un Mac ; Expo en fournit un.
      - name: Compilation iOS sans signature
        if: ${{ !inputs.signer_avec_expo }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile apercu-non-signe --non-interactive --wait

      - name: Récupérer le fichier produit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          adresse=$(eas build:list \
            --platform ios \
            --limit 1 \
            --status finished \
            --non-interactive \
            --json \
            | node -e "
                let brut = '';
                process.stdin.on('data', (bloc) => { brut += bloc; });
                process.stdin.on('end', () => {
                  const donnees = JSON.parse(brut);
                  if (!Array.isArray(donnees) || donnees.length === 0) {
                    console.error('Aucun IPA terminé trouvé.');
                    process.exit(1);
                  }
                  const url = donnees[0].artifacts && donnees[0].artifacts.buildUrl;
                  if (!url) {
                    console.error('La compilation n a pas produit de fichier.');
                    process.exit(1);
                  }
                  process.stdout.write(url);
                });
              ")
          echo "Fichier : $adresse"
          # Ne JAMAIS forcer l'extension. Sans signature, Expo ne peut pas
          # produire d'IPA — un IPA exige une signature — et livre une archive
          # tar.gz de Quittances.app. La nommer « .ipa » ferait croire à un
          # fichier installable, et les outils de re-signature refuseraient une
          # archive qu'ils ne savent pas ouvrir.
          nom="${adresse##*/}"
          extension="${nom#*.}"
          fichier="app-release.${extension}"
          curl --fail --location "$adresse" --output "$fichier"
          ls -lh "$fichier"
          echo "extension reelle : ${extension}"
          # Le nom du fichier est transmis aux étapes suivantes : elles ne
          # peuvent donc pas se tromper d'extension à leur tour.
          echo "FICHIER=${fichier}" >> "$GITHUB_ENV"

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-quittances
          path: ${{ env.FICHIER }}
          retention-days: 90
          if-no-files-found: error

      - name: Attacher le fichier à la version
        # Seulement pour une étiquette `v*`, comme pour l'APK. Rappel : sans
        # signature il n'y a pas d'IPA, seulement une archive — l'attacher sert
        # à conserver une trace, pas à distribuer.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          etiquette="${GITHUB_REF_NAME}"
          if gh release view "$etiquette" >/dev/null 2>&1; then
            gh release upload "$etiquette" "$FICHIER" --clobber
          elif gh release create "$etiquette" "$FICHIER" --title "Quittances ${etiquette}" --generate-notes; then
            echo "Publication ${etiquette} créée."
          else
            # Les deux flux se déclenchent sur la même étiquette : la
            # publication peut avoir été créée par l'autre entre-temps.
            gh release upload "$etiquette" "$FICHIER" --clobber
          fi

      - name: Rappeler ce que ce fichier permet
        run: |
          {
            echo "## Fichier iOS produit"
            echo ""
            echo "Fichier attaché : ${FICHIER}"
            echo ""
            if [ "${{ inputs.signer_avec_expo }}" = "true" ]; then
              echo "Cette compilation a été signée par Expo : elle peut être installée"
              echo "sur un iPhone via l'adresse de téléchargement fournie par Expo."
            else
              echo "Cette compilation **n'est pas signée**. Expo ne peut alors pas produire"
              echo "d'IPA — un IPA exige une signature — et livre une **archive tar.gz** de"
              echo "Quittances.app. Elle **ne s'installe pas** sur un iPhone en l'état."
              echo ""
              echo "Elle sert à archiver, à installer sur un simulateur, ou à être signée"
              echo "ensuite avec vos propres certificats."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
