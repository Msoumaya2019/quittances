# Compilation iOS, sans certificat ni profil dans ce dépôt.
#
# À lire avant de lancer quoi que ce soit, car c'est ici que les attentes
# doivent être justes.
#
#  - Ce dépôt ne contient aucun identifiant Apple. Sans identifiant Apple, Expo
#    ne peut pas produire d'application pour un appareil : il n'y a rien à
#    signer, et un IPA est par définition une archive *signée*. Le chemin sans
#    signature compile donc pour le **simulateur** (profil `apercu-simulateur`,
#    `ios.simulator: true`) et livre une archive `tar.gz` de `Quittances.app`.
#
#  - Mesuré sur le fichier livré, et non supposé : son `Info.plist` porte
#    `DTPlatformName = iphonesimulator`, et les deux tranches Mach-O
#    (x86_64, arm64) déclarent `platform = 7`, c'est-à-dire iOSSimulator.
#
#  - Conséquence, et c'est le point qu'on comprend mal : ce fichier ne
#    s'installe sur **aucun iPhone**, ni maintenant, ni après signature. Une
#    application compilée pour le simulateur reste une application de
#    simulateur, même signée. Il s'installe dans le simulateur iOS d'un Mac
#    (`xcrun simctl install`), et sert à archiver ou à vérifier que le projet
#    iOS compile.
#
#  - Pour installer sur un vrai iPhone, deux chemins existent, tous deux
#    demandant votre compte Apple :
#      1. faire signer la compilation par Expo, qui gère le certificat et le
#         profil à votre place (nécessite un compte Apple Developer pour une
#         durée de vie au-delà de sept jours) ;
#      2. compiler sur un Mac avec Xcode, où vous êtes déjà propriétaire de
#         vos certificats.
#
#  - Aucun certificat, aucun mot de passe et aucun profil de signature ne doit
#    être déposé dans ce dépôt public. Si vous choisissez la signature par
#    Expo, les éléments sensibles restent dans les secrets GitHub et chez Expo.

name: iOS

on:
  workflow_dispatch:
    inputs:
      signer_avec_expo:
        description: 'Faire signer par Expo (compte Apple requis). Décoché : compilation pour le simulateur, non signée.'
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

# Droits d'écriture, et un seul : `contents: write`, pour attacher le fichier à
# la publication d'une version étiquetée. Les identifiants Apple, s'ils servent,
# sont enregistrés chez Expo et dans les secrets GitHub — jamais utilisés pour
# écrire dans ce dépôt.
permissions:
  contents: write

jobs:
  construire-ipa:
    name: Construire le fichier iOS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier les flux de travail
        # Quelques secondes, contre une heure de compilation iOS.
        run: node scripts/check-workflows.mjs

      - name: Vérifier ce que le flux dira à la fin
        # Ce bloc a déjà promis qu'un binaire de simulateur s'installerait après
        # signature. On l'exécute donc, dans les deux branches, plutôt que de le
        # relire : une phrase fausse part sans bruit.
        run: npm run verifier:resume

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Lancer les tests
        run: npm run test:domaine

      - name: Installer EAS
        run: npm install --global eas-cli

      - name: Vérifier le jeton Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Le secret EXPO_TOKEN n'est pas défini sur ce dépôt."
            echo "Sans lui, aucune compilation iOS n'est possible."
            exit 1
          fi
          eas whoami

      # Chemin 1 : Expo signe et produit un IPA installable.
      - name: Compilation iOS signée par Expo
        if: inputs.signer_avec_expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile apercu --non-interactive --wait

      # Chemin 2 : compilation pour le simulateur, sans signature. Ce n'est pas
      # un pis-aller choisi par confort : sans identifiant Apple, Expo n'a rien
      # à signer, donc aucune compilation pour appareil n'est possible. Le seul
      # fichier iOS obtenable ici est une archive de simulateur.
      # Une compilation iOS exige un Mac ; Expo en fournit un.
      - name: Compilation iOS pour le simulateur
        if: ${{ !inputs.signer_avec_expo }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile apercu-simulateur --non-interactive --wait

      - name: Récupérer le fichier produit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          adresse=$(eas build:list \
            --platform ios \
            --limit 1 \
            --status finished \
            --non-interactive \
            --json \
            | node -e "
                let brut = '';
                process.stdin.on('data', (bloc) => { brut += bloc; });
                process.stdin.on('end', () => {
                  const donnees = JSON.parse(brut);
                  if (!Array.isArray(donnees) || donnees.length === 0) {
                    console.error('Aucune compilation iOS terminée trouvée.');
                    process.exit(1);
                  }
                  const url = donnees[0].artifacts && donnees[0].artifacts.buildUrl;
                  if (!url) {
                    console.error('La compilation n a pas produit de fichier.');
                    process.exit(1);
                  }
                  process.stdout.write(url);
                });
              ")
          echo "Fichier : $adresse"
          # Ne JAMAIS forcer l'extension. Sans signature, Expo livre une archive
          # tar.gz de Quittances.app, compilée pour le simulateur. La nommer
          # « .ipa » ferait croire à un fichier installable : un IPA est une
          # archive *signée*, et une compilation de simulateur ne s'installe sur
          # aucun iPhone, même signée. Le nom doit dire ce que le fichier est.
          nom="${adresse##*/}"
          extension="${nom#*.}"
          fichier="app-release.${extension}"
          curl --fail --location "$adresse" --output "$fichier"
          ls -lh "$fichier"
          echo "extension reelle : ${extension}"
          # Le nom du fichier est transmis aux étapes suivantes : elles ne
          # peuvent donc pas se tromper d'extension à leur tour.
          echo "FICHIER=${fichier}" >> "$GITHUB_ENV"

      - name: Publier le fichier
        uses: actions/upload-artifact@v4
        with:
          name: ios-quittances
          path: ${{ env.FICHIER }}
          retention-days: 90
          if-no-files-found: error

      - name: Attacher le fichier à la version
        # Seulement pour une étiquette `v*`, comme pour l'APK. Rappel : sans
        # identifiant Apple il n'y a pas d'IPA, seulement une archive de
        # simulateur — l'attacher sert à conserver une trace, pas à distribuer.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          etiquette="${GITHUB_REF_NAME}"
          if gh release view "$etiquette" >/dev/null 2>&1; then
            gh release upload "$etiquette" "$FICHIER" --clobber
          elif gh release create "$etiquette" "$FICHIER" --title "Quittances ${etiquette}" --generate-notes; then
            echo "Publication ${etiquette} créée."
          else
            # Les deux flux se déclenchent sur la même étiquette : la
            # publication peut avoir été créée par l'autre entre-temps.
            gh release upload "$etiquette" "$FICHIER" --clobber
          fi

      - name: Rappeler ce que ce fichier permet
        run: |
          {
            echo "## Fichier iOS produit"
            echo ""
            echo "Fichier attaché : ${FICHIER}"
            echo ""
            if [ "${{ inputs.signer_avec_expo }}" = "true" ]; then
              echo "Cette compilation a été signée par Expo : elle peut être installée"
              echo "sur un iPhone via l'adresse de téléchargement fournie par Expo."
            else
              echo "Cette compilation est destinée au **simulateur**, et n'est pas signée."
              echo "Ce n'est donc pas un IPA — un IPA est une archive signée — mais une"
              echo "**archive tar.gz** de Quittances.app."
              echo ""
              echo "Elle ne s'installe sur **aucun iPhone**, ni maintenant, ni après"
              echo "signature : une application compilée pour le simulateur le reste."
              echo "Elle s'installe dans le simulateur iOS d'un Mac (\`xcrun simctl install\`),"
              echo "et sert à archiver ou à vérifier que le projet iOS compile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
