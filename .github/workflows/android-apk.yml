# Compilation d'un APK Android installable, sans aucun secret dans ce dépôt.
#
# Cet APK est signé automatiquement par Expo avec une clé qu'Expo génère pour
# vous lors de la première compilation. Il n'y a donc rien à préparer pour le
# construire, et rien à confier à GitHub : la clé reste chez Expo.
#
# Le fichier produit se récupère de deux façons :
#  - dans l'onglet « Actions », sur la ligne de la compilation terminée,
#    section « Artifacts » — mais un artefact expire au bout de 90 jours et son
#    téléchargement exige un compte GitHub ;
#  - dans les « Releases » du dépôt, quand la compilation a été déclenchée par
#    une étiquette `v*` — le lien y reste, et se télécharge sans compte.

name: APK Android

on:
  # À la demande, depuis l'onglet « Actions ».
  workflow_dispatch:

  # À chaque version étiquetée, pour garder une trace.
  push:
    tags:
      - 'v*'

# Droits d'écriture, et un seul : `contents: write`, pour attacher l'APK à la
# publication d'une version étiquetée. Le jeton Expo, lui, n'a besoin d'aucun
# droit sur ce dépôt : il ne sert qu'à interroger et à compiler chez Expo.
permissions:
  contents: write

jobs:
  construire-apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    # 90 minutes, et non 45. Le plafond precedent tuait le travail EN COURS de
    # compilation EAS, sans un mot : le 23 septembre 2026, l'execution a ete
    # annulee a 45 min 33 s, en pleine etape « Lancer la compilation Android »,
    # et toutes les etapes suivantes ont ete sautees — donc aucun APK, et un
    # journal qui ne dit pas pourquoi.
    #
    # Le plafond n'etait pas faux au depart : les premieres compilations
    # tenaient en 14 a 21 minutes. La file d'attente d'EAS s'est allongee, et la
    # derniere compilation REUSSIE a pris 41 min 57 s — a trois minutes du
    # plafond. Un budget qui n'a plus de marge n'est plus un garde-fou : c'est
    # une panne qui attend son tour.
    #
    # 90 minutes, comme le flux de l'IPA appareil : deux fois le pire cas
    # observe, et un seul chiffre a retenir pour les deux compilations.
    timeout-minutes: 90

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        # `--legacy-peer-deps` est nécessaire : Expo 57 épingle react 19.2.3
        # alors que react-dom réclame 19.3.0. Le conflit est connu et sans effet
        # ici, car react-dom ne sert qu'au rendu web.
        run: npm ci --legacy-peer-deps

      - name: Vérifier les flux de travail
        # Quelques secondes, contre vingt minutes de compilation : ce contrôle
        # passe donc en premier.
        run: node scripts/check-workflows.mjs

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Vérifier les types des tests
        # `tsconfig.json` exclut `tests/` et `.verif/`. Sans cette étape, une
        # erreur de type écrite dans un test traverse toute la chaîne sans être
        # vue : `npx tsc --noEmit` reste vert, et Node efface les types.
        run: npm run verifier:tests

      - name: Lancer les tests
        run: npm run test:domaine

      - name: Installer EAS
        run: npm install --global eas-cli

      - name: Se connecter à Expo
        # Le jeton est un secret de ce dépôt uniquement : il n'apparaît jamais
        # dans le code. Voir la documentation pour le créer en trois minutes.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Lancer la compilation Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # `--wait` attend la fin côté Expo et rapatrie le fichier dans ce job.
        run: eas build --platform android --profile apercu --non-interactive --wait

      - name: Récupérer l'APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # On ne se fie pas au nom du fichier : on interroge Expo sur l'adresse
        # du dernier APK terminé, et on la télécharge.
        run: |
          set -euo pipefail
          adresse=$(eas build:list \
            --platform android \
            --limit 1 \
            --status finished \
            --non-interactive \
            --json \
            | node -e "
                let brut = '';
                process.stdin.on('data', (bloc) => { brut += bloc; });
                process.stdin.on('end', () => {
                  const donnees = JSON.parse(brut);
                  if (!Array.isArray(donnees) || donnees.length === 0) {
                    console.error('Aucun APK terminé trouvé.');
                    process.exit(1);
                  }
                  const url = donnees[0].artifacts && donnees[0].artifacts.buildUrl;
                  if (!url) {
                    console.error('La compilation n a pas produit de fichier.');
                    process.exit(1);
                  }
                  process.stdout.write(url);
                });
              ")
          echo "Fichier : $adresse"
          # Ne jamais forcer l'extension : elle est lue sur l'adresse fournie
          # par Expo, pour que le nom du fichier ne mente pas sur son contenu.
          nom="${adresse##*/}"
          extension="${nom#*.}"
          # La version est LUE dans `app.json`, jamais recopiee : ecrite deux
          # fois, elle finit par mentir. Un fichier nomme « app-release.apk »
          # ne disait pas non plus quelle version il portait, et rien ne
          # permettait de distinguer deux telechargements.
          version=$(node -p "require('./app.json').expo.version")
          fichier="Quittances-${version}-android.${extension}"
          curl --fail --location "$adresse" --output "$fichier"
          ls -lh "$fichier"
          echo "FICHIER=${fichier}" >> "$GITHUB_ENV"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-quittances
          path: ${{ env.FICHIER }}
          retention-days: 90
          if-no-files-found: error

      - name: Attacher l'APK à la version
        # Seulement pour une étiquette `v*`. Une compilation lancée à la demande
        # ne touche pas aux publications : on peut essayer autant de fois qu'on
        # veut sans rien laisser derrière soi.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # Le jeton fourni par GitHub lui-même, pas celui d'Expo : il est
          # recréé à chaque exécution et expire avec elle.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          etiquette="${GITHUB_REF_NAME}"
          if gh release view "$etiquette" >/dev/null 2>&1; then
            gh release upload "$etiquette" "$FICHIER" --clobber
          elif gh release create "$etiquette" "$FICHIER" --title "Quittances ${etiquette}" --generate-notes; then
            echo "Publication ${etiquette} créée."
          else
            # Les deux flux se déclenchent sur la même étiquette : la
            # publication peut avoir été créée par l'autre entre-temps.
            gh release upload "$etiquette" "$FICHIER" --clobber
          fi
